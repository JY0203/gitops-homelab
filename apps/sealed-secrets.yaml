apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.22.0
      helm:
        valueFiles:
          - $values/manifests/sealed-secrets/values.yaml
    - repoURL: https://github.com/JY0203/gitops-homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system # 預設會到這個 namespace 找 controller
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
