   grafana:
     admin:
       existingSecret: grafana-admin
       userKey: admin-user
       passwordKey: admin-password
     ingress:
       enabled: true
       ingressClassName: traefik
       hosts:
         - grafana.lab
     persistence:
       enabled: true
       type: pvc
       storageClassName: local-path-data
       size: 5Gi
   prometheus:
     prometheusSpec:
       retention: 15d
       retentionSize: 25GB
       storageSpec:
         volumeClaimTemplate:
           spec:
             storageClassName: local-path-data
             accessModes: ["ReadWriteOnce"]
             resources:
               requests:
                 storage: 30Gi
